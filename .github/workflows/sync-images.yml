name: Sync Images to GHCR
on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Sync
        run: |
          for img in "iiidev/iii:0.11.2" "busybox:1.36"; do
            tag=$(echo $img | tr '/:' '_-')
            echo "Syncing $img -> ghcr.io/alleyluo/$tag"
            docker pull "$img"
            docker tag "$img" "ghcr.io/alleyluo/$tag"
            docker push "ghcr.io/alleyluo/$tag"
          done
