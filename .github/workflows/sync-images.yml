name: Sync Docker Images to ACR
on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Login to ACR
        run: echo "${{ secrets.ACR_PASSWORD }}" | docker login -u "${{ secrets.ACR_USERNAME }}" --password-stdin registry.cn-hangzhou.aliyuncs.com

      - name: Sync images
        run: |
          for img in "iiidev/iii:0.11.2" "busybox:1.36"; do
            tag=$(echo $img | tr '/:' '_-')
            docker pull "$img"
            docker tag "$img" "registry.cn-hangzhou.aliyuncs.com/laoluo-warehouse/$tag"
            docker push "registry.cn-hangzhou.aliyuncs.com/laoluo-warehouse/$tag"
          done
